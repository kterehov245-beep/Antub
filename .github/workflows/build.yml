name: Build Antub APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack project
        run: |
          best=""
          bt=0
          for f in *.zip; do
            [ -e "$f" ] || { echo "В репозитории нет zip-файла"; exit 1; }
            t=$(git log -1 --format=%ct -- "$f")
            if [ "${t:-0}" -ge "$bt" ]; then best="$f"; bt="${t:-0}"; fi
          done
          echo "Using: $best"
          unzip -o "$best"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Antub.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: antub-latest
          name: Antub (latest)
          files: Antub.apk
